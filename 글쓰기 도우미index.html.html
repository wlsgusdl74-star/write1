<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 학급 신문 작성 도우미</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    /* 비밀번호 모달 등장 애니메이션 */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-pop-in {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    // =================================================================
    // 🔗 1. 구글 Apps Script 웹앱 배포 URL
    // =================================================================
    const SCRIPT_URL = "여기에_새로_발급받은_웹앱_URL을_넣으세요"; 

    // =================================================================
    // 🤖 2. 구글 Gemini AI API 키
    // =================================================================
    const GEMINI_API_KEY = ""; 

    const { useState, useEffect, useRef } = React;

    const EXPANSION_QUESTIONS = [
      '💡 그 활동을 할 때 마음이나 기분은 어땠나요?',
      '💡 가장 재미있거나 기억에 남는 장면은 무엇이었나요?',
      '💡 같이 한 친구나 선생님에게 전하고 싶은 말은 무엇인가요?'
    ];

    const MOOD_OPTIONS = ['😊 신나고 즐거워요', '🥰 뿌듯하고 행복해요', '🤔 신기하고 재미있어요', '😌 편안하고 유익해요', '🔥 의욕이 넘쳐요'];

    function App() {
      const [activeTab, setActiveTab] = useState('student'); // 'student' | 'teacher'
      
      // ★ 추가: 등록된 반 목록
      const [classList, setClassList] = useState([]);
      
      // 선생님 잠금 및 등록 관련 상태
      const [showPasswordModal, setShowPasswordModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' (기존 반 로그인) | 'register' (새 반 등록)
      
      const [loginClass, setLoginClass] = useState(''); // 로그인 시 선택한 반
      const [registerClass, setRegisterClass] = useState(''); // 새로 만들 반 이름
      const [passwordInput, setPasswordInput] = useState(''); // 입력한 비밀번호
      
      const [loggedInTeacher, setLoggedInTeacher] = useState(''); 
      const passwordInputRef = useRef(null);

      // 학생 개별 데이터 상태
      const [studentName, setStudentName] = useState('');
      const [targetTeacher, setTargetTeacher] = useState('');
      const [activityTitle, setActivityTitle] = useState('');
      const [mood, setMood] = useState('😊 신나고 즐거워요');
      const [shortMsg, setShortMsg] = useState('');
      const [step, setStep] = useState(1);
      
      const [w6, setW6] = useState({ who: '', when: '', where: '', what: '', how: '', why: '' });
      const [sentence1, setSentence1] = useState('');
      const [sentence2, setSentence2] = useState('');
      const [sentence3, setSentence3] = useState('');
      const [sentence4, setSentence4] = useState('');
      const [selectedQuestion, setSelectedQuestion] = useState(EXPANSION_QUESTIONS[0]);
      const [draftText, setDraftText] = useState('');
      const [focusedField, setFocusedField] = useState('sentence1');
      const [grammarIssues, setGrammarIssues] = useState([]);
      const [isCompleted, setIsCompleted] = useState(false);

      const [isGeneratingTitle, setIsGeneratingTitle] = useState(false);
      const [suggestedTitles, setSuggestedTitles] = useState([]);

      const [teacherDataList, setTeacherDataList] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [loadingText, setLoadingText] = useState('처리 중입니다...');
      const [toastMsg, setToastMsg] = useState(null);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const isUrlConfigured = () => {
        return SCRIPT_URL && !SCRIPT_URL.includes("여기에") && SCRIPT_URL.startsWith("https://script.google.com");
      };

      // 앱 실행 시 서버에서 등록된 반(교사) 목록 가져오기
      useEffect(() => {
        if (isUrlConfigured()) {
          fetchClasses();
        }
      }, []);

      // 반 목록이 업데이트 되면 학생 선택 드롭다운 기본값 설정
      useEffect(() => {
        if (classList.length > 0 && !targetTeacher) {
          setTargetTeacher(classList[0]);
        }
        if (classList.length > 0 && !loginClass) {
          setLoginClass(classList[0]);
        }
      }, [classList]);

      // 패스워드 모달이 열리면 자동으로 입력창 포커스
      useEffect(() => {
        if (showPasswordModal && passwordInputRef.current) {
          setTimeout(() => passwordInputRef.current.focus(), 100);
        }
      }, [showPasswordModal, authMode]);

      // 교사 대시보드 진입 시 시트 데이터 조회
      useEffect(() => {
        if (activeTab === 'teacher') fetchSheetData();
      }, [activeTab]);

      // GET: 반 목록 조회
      const fetchClasses = async () => {
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getClasses`);
          const result = await response.json();
          if (result.success) {
            setClassList(result.data || []);
          }
        } catch (err) {
          console.error("반 목록 불러오기 실패", err);
        }
      };

      // GET: 시트 데이터 조회
      const fetchSheetData = async () => {
        if (!isUrlConfigured()) return;
        setIsLoading(true);
        setLoadingText('📊 데이터를 불러오는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=getData`);
          const result = await response.json();
          if (result.success) {
            setTeacherDataList(result.data || []);
            triggerToast('📊 데이터를 성공적으로 불러왔습니다.');
          } else {
            triggerToast('❌ 조회 실패: ' + (result.message || '오류 발생'));
          }
        } catch (err) {
          triggerToast('❌ 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      // POST: 새로운 반(선생님) 등록
      const handleTeacherRegister = async () => {
        if (!registerClass.trim()) return triggerToast('⚠️ 반 이름을 입력해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');
        
        setIsLoading(true);
        setLoadingText('새로운 반을 등록하는 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'registerTeacher', className: registerClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text(); // JSON 변환 전 텍스트로 먼저 받기 (에러 방지)
          try {
            const result = JSON.parse(text);
            if (result.success) {
              triggerToast(`🎉 [${registerClass}] 반이 등록되었습니다!`);
              await fetchClasses(); // 목록 갱신
              
              // 등록 후 즉시 로그인 처리
              setLoggedInTeacher(registerClass);
              setShowPasswordModal(false);
              setPasswordInput('');
              setActiveTab('teacher');
            } else {
              triggerToast('❌ 등록 실패: ' + result.message);
            }
          } catch (parseError) {
            console.error("서버 응답 에러 원본:", text);
            triggerToast('❌ 구글 서버 오류! (반드시 앱스 스크립트 "새 배포"를 다시 진행해 주세요!)');
          }
        } catch (err) {
          triggerToast('❌ 인터넷 연결 등 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      // POST: 선생님 로그인
      const handleTeacherLogin = async () => {
        if (!loginClass) return triggerToast('⚠️ 먼저 등록된 반을 선택해주세요.');
        if (!passwordInput.trim()) return triggerToast('⚠️ 비밀번호를 입력해주세요.');

        setIsLoading(true);
        setLoadingText('비밀번호 확인 중...');
        
        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ action: 'loginTeacher', className: loginClass, password: passwordInput }),
            redirect: 'follow'
          });
          
          const text = await response.text();
          try {
            const result = JSON.parse(text);
            if (result.success) {
              setShowPasswordModal(false);
              setPasswordInput('');
              setLoggedInTeacher(loginClass);
              setActiveTab('teacher');
              triggerToast(`🔓 환영합니다, ${loginClass} 선생님!`);
            } else {
              triggerToast('❌ 로그인 실패: ' + result.message);
              setPasswordInput(''); // 틀렸을 때 비밀번호 비우기
            }
          } catch(e) {
            triggerToast('❌ 구글 서버 오류! (반드시 앱스 스크립트 "새 배포"를 다시 진행해 주세요!)');
          }
        } catch (err) {
          triggerToast('❌ 인터넷 연결 등 통신 오류가 발생했습니다.');
        } finally {
          setIsLoading(false);
        }
      };

      // GET: 데이터 비우기
      const handleClearSheet = async () => {
        if (!confirm(`정말로 [${loggedInTeacher}] 반의 응답 데이터를 초기화하시겠습니까?\n(다른 반 학생들의 기록은 안전하게 유지됩니다)`)) return;
        if (!isUrlConfigured()) return;
        
        setIsLoading(true);
        setLoadingText('🗑️ 우리 반 응답 데이터를 비우는 중...');
        try {
          const response = await fetch(`${SCRIPT_URL}?action=clearData&teacher=${encodeURIComponent(loggedInTeacher)}`);
          const result = await response.json();
          if (result.success) {
            triggerToast(result.message);
            fetchSheetData();
          } else {
            triggerToast('❌ ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 데이터 초기화 중 통신 오류 발생');
        } finally {
          setIsLoading(false);
        }
      };

      // POST: 기사 제출 (action 파라미터 추가)
      const handleSaveToSpreadsheet = async () => {
        if (!studentName.trim() || !activityTitle.trim()) return triggerToast('⚠️ 학생 이름과 기사 제목을 모두 입력해 주세요!');
        if (!targetTeacher) return triggerToast('⚠️ 선생님(반)이 아직 등록되지 않았습니다!');
        if (!isUrlConfigured()) return triggerToast('⚠️ SCRIPT_URL을 설정해 주세요.');

        setIsLoading(true);
        setLoadingText('🚀 기사를 제출하는 중...');

        const payload = {
          action: 'saveArticle', // 백엔드에게 기사 저장 요청임을 알림
          name: studentName, 
          activityTitle: activityTitle, 
          mood: mood, 
          shortMsg: shortMsg,
          w6: w6, 
          sentence1: sentence1, 
          sentence2: sentence2, 
          sentence3: sentence3, 
          sentence4: sentence4, 
          draftText: draftText,
          targetTeacher: targetTeacher 
        };

        try {
          const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (result.success) {
            triggerToast(result.message || '🎉 기사가 성공적으로 제출되었습니다!');
            setIsCompleted(true);
          } else {
            triggerToast('❌ 제출 실패: ' + result.message);
          }
        } catch (err) {
          triggerToast('❌ 저장 실패: 네트워크 연결이나 웹앱 URL을 확인해 주세요.');
        } finally {
          setIsLoading(false);
        }
      };

      // AI 제목 추천 함수
      const handleGenerateTitles = async () => {
        if (!draftText || draftText.trim() === '') return triggerToast('💡 먼저 2단계에서 기사 내용을 완성해주세요!');
        if (!GEMINI_API_KEY) return triggerToast('⚠️ 코드 상단의 GEMINI_API_KEY를 입력해주세요.');

        setIsGeneratingTitle(true);
        triggerToast('🤖 AI 도우미가 멋진 제목을 고민하고 있어요...');

        try {
          const payload = {
            contents: [{ parts: [{ text: `다음 초등학생이 작성한 학급 신문 기사 내용을 읽고, 재미있고 창의적인 기사 제목 3개를 추천해줘. 반드시 JSON 배열 형식으로만 응답해줘. 예시: ["제목1", "제목2", "제목3"]\n\n기사 내용: "${draftText}"` }] }],
            generationConfig: { responseMimeType: "application/json", responseSchema: { type: "ARRAY", items: { type: "STRING" } } }
          };

          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
          const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const result = await response.json();

          if (result.candidates && result.candidates[0].content?.parts?.[0]?.text) {
            let jsonText = result.candidates[0].content.parts[0].text.replace(/^```json/i, '').replace(/```$/i, '').trim();
            try {
              setSuggestedTitles(JSON.parse(jsonText));
              triggerToast('✨ AI 도우미가 제목을 추천했어요! 마음에 드는 것을 클릭해보세요.');
            } catch (e) {
              triggerToast('❌ AI 응답 형식이 올바르지 않습니다.');
            }
          } else {
            triggerToast('❌ 제목 생성에 실패했어요. 직접 제목을 입력해주세요.');
          }
        } catch (error) {
          triggerToast('❌ AI 서버와 통신하는 중 문제가 발생했어요.');
        } finally {
          setIsGeneratingTitle(false);
        }
      };

      const insertWordChip = (word) => {
        if (!word) return;
        const addSpace = (prev) => (prev ? `${prev.trim()} ${word}` : word);
        if (focusedField === 'sentence1') setSentence1(addSpace);
        else if (focusedField === 'sentence2') setSentence2(addSpace);
        else if (focusedField === 'sentence3') setSentence3(addSpace);
        else if (focusedField === 'sentence4') setSentence4(addSpace);
        else if (focusedField === 'draftText') setDraftText(addSpace);
        triggerToast(`✨ 선택한 칸에 "${word}" 단어를 넣었습니다!`);
      };

      const combineSentences = () => {
        const combined = [sentence1, sentence2, sentence3, sentence4].map(s => s.trim()).filter(Boolean).join(' ');
        if (!combined) return triggerToast('💡 문장을 먼저 하나 이상 입력해 주세요!');
        setDraftText(combined);
        triggerToast('🎉 문장들이 연결되어 기사글 상자로 모아졌습니다!');
      };

      const scanGrammar = () => {
        triggerToast('🔍 맞춤법을 검사하고 있습니다...');
        let issues = [];
        if (draftText.includes('떡뽂이')) issues.push({ id: 'g1', errorWord: '떡뽂이', correct: '떡볶이', options: ['떡뽂이', '떡볶이'], desc: "'볶다'에서 온 말이므로 '떡볶이'가 바른 표현이에요!" });
        if (draftText.includes('맛있엇다')) issues.push({ id: 'g2', errorWord: '맛있엇다', correct: '맛있었다', options: ['맛있엇다', '맛있었다'], desc: "지난 일은 쌍시옷(ㅆ)을 써서 '맛있었다'로 써요!" });
        if (issues.length === 0) issues.push({ id: 'g3', errorWord: '참 재밌엇다', correct: '참 재미있었다', options: ['참 재밌엇다', '참 재미있었다'], desc: "'재미있었다'로 바르게 고쳐주면 기사가 훨씬 또렷해져요!" });
        setGrammarIssues(issues);
      };

      const resolveIssue = (issueId, selected, correct) => {
        if (selected !== correct) return triggerToast('💡 다시 한번 생각해보세요!');
        setDraftText((prev) => prev.replace(new RegExp(selected === correct ? '' : '떡뽂이', 'g'), correct)); 
        setGrammarIssues((prev) => prev.map((item) => item.id === issueId ? { ...item, resolved: true } : item));
        triggerToast('💮 참 잘했어요! 정답 도장이 찍혔습니다.');
      };

      const downloadCSV = () => {
        const myClassData = teacherDataList.filter(row => row.targetTeacher === loggedInTeacher);
        if (myClassData.length === 0) return triggerToast('⚠️ 다운로드할 우리 반 데이터가 없습니다.');
        
        let csvContent = '\uFEFF응답 일시,이름,기분,한 줄 메시지,기사 주제,누가,언제,어디서,무엇을,어떻게,왜,최종기사문\n';
        myClassData.forEach((row) => {
          const safe = (txt) => `"${(txt || '').toString().replace(/"/g, '""')}"`;
          csvContent += `${safe(row.timestamp)},${safe(row.name)},${safe(row.mood)},${safe(row.shortMsg)},${safe(row.activityTitle)},${safe(row.w6?.who)},${safe(row.w6?.when)},${safe(row.w6?.where)},${safe(row.w6?.what)},${safe(row.w6?.how)},${safe(row.w6?.why)},${safe(row.draftText)}\n`;
        });
        const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url; a.download = `학급신문_${loggedInTeacher}_응답목록_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
      };

      return (
        <div className="min-h-screen pb-24 relative">
          
          {/* 통신 중 로딩 오버레이 */}
          {isLoading && (
            <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center text-white px-4">
              <div className="bg-white text-slate-900 p-6 rounded-3xl shadow-2xl flex flex-col items-center gap-4 max-w-sm w-full border border-slate-100">
                <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p className="font-extrabold text-base text-center">{loadingText}</p>
                <span className="text-xs text-slate-400 font-medium">잠시만 기다려 주세요...</span>
              </div>
            </div>
          )}

          {/* 선생님 전용 잠금 모달 (로그인 및 새 반 등록) */}
          {showPasswordModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center px-4 transition-all">
              <div className="bg-white rounded-[2rem] shadow-2xl p-8 w-full max-w-sm border border-slate-100 animate-pop-in">
                <div className="text-center mb-6">
                  <div className="text-5xl mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-3">🔒</div>
                  <h3 className="text-2xl font-black text-slate-900 tracking-tight">선생님 전용</h3>
                </div>

                {/* 탭 전환 (로그인 vs 등록) */}
                <div className="flex gap-2 mb-6 p-1 bg-slate-100 rounded-xl">
                  <button onClick={() => setAuthMode('login')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authMode === 'login' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>로그인</button>
                  <button onClick={() => setAuthMode('register')} className={`flex-1 py-2 text-sm font-bold rounded-lg transition-all ${authMode === 'register' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>새로운 반 만들기</button>
                </div>

                {authMode === 'login' ? (
                  /* 로그인 모드 폼 */
                  <div className="space-y-4">
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-500 ml-1">로그인할 반 선택</label>
                      {classList.length > 0 ? (
                        <select 
                          value={loginClass} 
                          onChange={(e) => setLoginClass(e.target.value)}
                          className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-bold focus:border-indigo-500 outline-none"
                        >
                          {classList.map((c, i) => <option key={i} value={c}>{c}</option>)}
                        </select>
                      ) : (
                        <div className="w-full px-4 py-3 bg-rose-50 text-rose-500 rounded-xl border border-rose-200 font-bold text-sm text-center">
                          등록된 반이 없습니다. 새로 만들어주세요!
                        </div>
                      )}
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-500 ml-1">비밀번호</label>
                      <input
                        type="password"
                        ref={passwordInputRef}
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') handleTeacherLogin(); }}
                        placeholder="비밀번호 입력"
                        className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-bold focus:border-indigo-500 outline-none tracking-widest text-center"
                      />
                    </div>
                    <div className="flex gap-3 pt-3">
                      <button onClick={() => {setShowPasswordModal(false); setPasswordInput('');}} className="flex-1 py-3.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold">취소</button>
                      <button onClick={handleTeacherLogin} className="flex-1 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-lg shadow-indigo-200">입장하기</button>
                    </div>
                  </div>
                ) : (
                  /* 새 반 등록 모드 폼 */
                  <div className="space-y-4">
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-500 ml-1">새로운 반 이름 (예: 3학년 2반)</label>
                      <input
                        type="text"
                        value={registerClass}
                        onChange={(e) => setRegisterClass(e.target.value)}
                        placeholder="반 이름을 적어주세요"
                        className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-bold focus:border-indigo-500 outline-none"
                      />
                    </div>
                    <div className="space-y-1">
                      <label className="text-xs font-bold text-slate-500 ml-1">설정할 비밀번호</label>
                      <input
                        type="password"
                        ref={passwordInputRef}
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') handleTeacherRegister(); }}
                        placeholder="새 비밀번호 입력"
                        className="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 font-bold focus:border-indigo-500 outline-none tracking-widest text-center"
                      />
                    </div>
                    <div className="flex gap-3 pt-3">
                      <button onClick={() => {setShowPasswordModal(false); setPasswordInput('');}} className="flex-1 py-3.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 font-bold">취소</button>
                      <button onClick={handleTeacherRegister} className="flex-1 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-lg shadow-emerald-200">반 만들기</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 토스트 알림창 */}
          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white px-6 py-3.5 rounded-full shadow-2xl flex items-center gap-3 border border-slate-700 animate-bounce">
              <span className="font-bold text-sm whitespace-nowrap">{toastMsg}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-indigo-600 to-purple-600 p-3 rounded-2xl text-white shadow-md">📰</div>
                <div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight flex items-center gap-2">
                    학급 신문 작성 도우미
                    <span className="text-xs font-bold px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-full hidden sm:inline-block">AI 탑재 버전</span>
                  </h1>
                </div>
              </div>
              <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
                <button onClick={() => setActiveTab('student')} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${activeTab === 'student' ? 'bg-white text-indigo-600 shadow-md scale-105' : 'text-slate-500'}`}>📖 학생용</button>
                <button onClick={() => { if (activeTab !== 'teacher') setShowPasswordModal(true); }} className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${activeTab === 'teacher' ? 'bg-slate-900 text-white shadow-md scale-105' : 'text-slate-500'}`}>📊 교사용</button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 mt-6">
            {activeTab === 'student' ? (
              <div className="space-y-6">
                
                {/* 1) 학생 프로필 및 우리반 선생님 선택 (4칸 구성) */}
                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                  <div className="flex items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200 focus-within:border-indigo-400 transition-colors">
                    <span className="text-xs font-extrabold text-slate-500 shrink-0">👤 이름:</span>
                    <input type="text" value={studentName} onChange={(e) => setStudentName(e.target.value)} placeholder="이름 입력" className="w-full bg-transparent px-3 py-1.5 font-bold text-sm outline-none" />
                  </div>

                  {/* 선생님 선택 드롭다운 (서버에서 가져온 classList 배열 사용) */}
                  <div className="flex items-center gap-2 bg-indigo-50 p-2.5 rounded-2xl border border-indigo-200 focus-within:border-indigo-400 transition-colors">
                    <span className="text-xs font-extrabold text-indigo-800 shrink-0">👨‍🏫 우리 반:</span>
                    {classList.length > 0 ? (
                      <select value={targetTeacher} onChange={(e) => setTargetTeacher(e.target.value)} className="w-full bg-transparent px-3 py-1.5 font-bold text-sm text-indigo-900 outline-none cursor-pointer">
                        {classList.map((c, idx) => <option key={idx} value={c}>{c}</option>)}
                      </select>
                    ) : (
                      <span className="text-xs font-bold text-rose-500 w-full px-2">선생님이 반을 등록해야 합니다!</span>
                    )}
                  </div>

                  <div className="flex items-center gap-2 bg-purple-50 p-2.5 rounded-2xl border border-purple-200 focus-within:border-purple-400 transition-colors">
                    <span className="text-xs font-extrabold text-purple-800 shrink-0">✨ 주제:</span>
                    <input type="text" value={activityTitle} onChange={(e) => setActivityTitle(e.target.value)} placeholder="예: 요리 교실, 소풍" className="w-full bg-transparent px-3 py-1.5 font-bold text-sm text-purple-900 outline-none" />
                  </div>

                  <div className="flex items-center gap-2 bg-amber-50 p-2.5 rounded-2xl border border-amber-200 focus-within:border-amber-400 transition-colors">
                    <span className="text-xs font-extrabold text-amber-800 shrink-0">😊 기분:</span>
                    <select value={mood} onChange={(e) => setMood(e.target.value)} className="w-full bg-transparent px-3 py-1.5 font-bold text-sm text-amber-900 outline-none cursor-pointer">
                      {MOOD_OPTIONS.map((m, idx) => <option key={idx} value={m}>{m}</option>)}
                    </select>
                  </div>
                </div>

                {/* 2) 단계 네비게이션 */}
                <div className="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-3 gap-3 text-center">
                  <button onClick={() => setStep(1)} className={`p-3.5 rounded-2xl font-extrabold text-sm sm:text-base transition-all ${step === 1 ? 'bg-amber-500 text-white shadow-lg shadow-amber-200 scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>1단계: 육하원칙</button>
                  <button onClick={() => setStep(2)} className={`p-3.5 rounded-2xl font-extrabold text-sm sm:text-base transition-all ${step === 2 ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200 scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>2단계: 문장확장</button>
                  <button onClick={() => setStep(3)} className={`p-3.5 rounded-2xl font-extrabold text-sm sm:text-base transition-all ${step === 3 ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-200 scale-[1.02]' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>3단계: 마무리</button>
                </div>

                {/* 1단계: 육하원칙 - 1*6 1열 고정 및 큼직한 레이아웃 */}
                {step === 1 && (
                  <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-md space-y-6">
                    <h2 className="text-3xl font-black text-slate-900"><span className="text-amber-500 mr-2">1단계.</span> 육하원칙 단어 카드를 채워요!</h2>
                    <div className="grid grid-cols-1 gap-6">
                      {[
                        { key: 'who', label: '👤 누가', desc: '누가 활동에 참여했나요?', placeholder: '예: 우리 반 친구들과 선생님이', bg: 'bg-rose-50 border-rose-200' },
                        { key: 'when', label: '📅 언제', desc: '언제 했던 활동인가요?', placeholder: '예: 지난주 화요일 3교시에', bg: 'bg-amber-50 border-amber-200' },
                        { key: 'where', label: '📍 어디서', desc: '어디에서 일어난 일인가요?', placeholder: '예: 교실에서 / 학교 운동장에서', bg: 'bg-emerald-50 border-emerald-200' },
                        { key: 'what', label: '🍕 무엇을', desc: '무엇을 만들거나 활동했나요?', placeholder: '예: 맛있는 떡볶이 만들기', bg: 'bg-sky-50 border-sky-200' },
                        { key: 'how', label: '🍳 어떻게', desc: '어떤 방법으로 진행했나요?', placeholder: '예: 다 같이 재료를 썰고 양념을 섞어서', bg: 'bg-indigo-50 border-indigo-200' },
                        { key: 'why', label: '💡 왜', desc: '왜 이 활동을 하게 되었나요?', placeholder: '예: 친구들과의 협동심을 기르고 맛있게 나눠 먹으려고', bg: 'bg-purple-50 border-purple-200' }
                      ].map((item) => (
                        <div key={item.key} className={`p-8 rounded-[2rem] border-2 ${item.bg} space-y-4 transition-transform focus-within:-translate-y-1`}>
                          <span className="text-2xl font-black px-6 py-3 rounded-full bg-white text-slate-800 border shadow-sm inline-block">{item.label}</span>
                          <p className="text-xl font-bold text-slate-600 ml-2">{item.desc}</p>
                          <input 
                            type="text" 
                            value={w6[item.key] || ''} 
                            onChange={(e) => setW6({ ...w6, [item.key]: e.target.value })} 
                            placeholder={item.placeholder} 
                            className="w-full px-6 py-5 bg-white rounded-2xl border border-slate-300 font-black text-xl text-slate-900 focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none shadow-inner"
                          />
                        </div>
                      ))}
                    </div>
                    <div className="flex justify-end pt-5">
                      <button onClick={() => setStep(2)} className="bg-indigo-600 text-white px-8 py-5 rounded-2xl font-black text-xl shadow-xl shadow-indigo-200 hover:bg-indigo-700 hover:scale-105 transition-all">2단계: 문장 확장하기 👉</button>
                    </div>
                  </div>
                )}

                {/* 2단계 */}
                {step === 2 && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-6 bg-white p-7 rounded-[2rem] border border-slate-200 shadow-md space-y-6">
                      <h3 className="font-black text-xl text-indigo-900 flex items-center gap-2">✨ 내가 모은 단어 칩 <span className="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full">클릭해서 넣기</span></h3>
                      <div className="grid grid-cols-3 gap-3">
                        {[
                          { key: 'when', label: '📅 언제' }, { key: 'where', label: '📍 어디서' }, { key: 'who', label: '👤 누가' },
                          { key: 'what', label: '🍕 무엇을' }, { key: 'how', label: '🍳 어떻게' }, { key: 'why', label: '💡 왜' }
                        ].map((chip) => {
                          const val = w6[chip.key];
                          return (
                            <button key={chip.key} onClick={() => insertWordChip(val)} disabled={!val} className={`p-4 rounded-2xl border font-bold text-left transition-all ${val ? 'bg-indigo-50/50 hover:bg-indigo-100 border-indigo-200 hover:border-indigo-400 hover:-translate-y-1 shadow-sm' : 'bg-slate-50 text-slate-400 border-slate-100 opacity-60'}`}>
                              <div className="text-xs text-slate-500 mb-1">{chip.label}</div>
                              <div className="truncate font-black text-sm text-slate-800">{val || '미입력'}</div>
                            </button>
                          );
                        })}
                      </div>

                      <div className="bg-amber-50 p-6 rounded-3xl border border-amber-200 space-y-5">
                        <div className="flex justify-between items-center bg-white/60 px-4 py-2 rounded-xl">
                          <span className="text-xs font-extrabold text-amber-800">현재 입력 중인 칸:</span>
                          <span className="text-xs font-black bg-amber-500 text-white px-2 py-1 rounded-md">{focusedField}</span>
                        </div>
                        
                        <div className="space-y-4">
                          {[
                            { id: 'sentence1', label: '1번 문장 (배경)', val: sentence1, set: setSentence1, ph: "예: 어제 교실에서 친구들과..." },
                            { id: 'sentence2', label: '2번 문장 (활동)', val: sentence2, set: setSentence2, ph: "예: 맛있는 떡볶이를 만들었습니다." },
                            { id: 'sentence3', label: '3번 문장 (느낌)', val: sentence3, set: setSentence3, ph: "예: 서로 도와서 정말 뿌듯했습니다." }
                          ].map(item => (
                            <div key={item.id} className="relative">
                              <span className="absolute -top-2 left-3 bg-amber-50 px-1 text-[10px] font-black text-slate-600">{item.label}</span>
                              <input type="text" value={item.val} onFocus={() => setFocusedField(item.id)} onChange={(e) => item.set(e.target.value)} placeholder={item.ph} className="w-full px-4 py-3 bg-white rounded-xl border border-amber-200 font-bold text-sm focus:ring-2 focus:ring-amber-500 outline-none shadow-sm"/>
                            </div>
                          ))}

                          <div className="bg-purple-100/50 p-5 rounded-2xl border border-purple-200 space-y-3 mt-4">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-black text-purple-900">💬 4번 문장 (생각 더하기):</span>
                              <button type="button" onClick={() => { const nextIdx = (EXPANSION_QUESTIONS.indexOf(selectedQuestion) + 1) % EXPANSION_QUESTIONS.length; setSelectedQuestion(EXPANSION_QUESTIONS[nextIdx]); }} className="text-xs font-bold text-purple-600 hover:text-purple-800 bg-purple-200/50 px-2 py-1 rounded-md transition-colors">다른 질문 보기 🔄</button>
                            </div>
                            <select value={selectedQuestion} onChange={(e) => setSelectedQuestion(e.target.value)} className="w-full px-3 py-2 bg-white rounded-xl border border-purple-200 font-bold text-xs text-purple-900 focus:outline-none focus:border-purple-400 cursor-pointer shadow-sm">
                              {EXPANSION_QUESTIONS.map((q, idx) => (<option key={idx} value={q}>{q}</option>))}
                            </select>
                            <input type="text" value={sentence4} onFocus={() => setFocusedField('sentence4')} onChange={(e) => setSentence4(e.target.value)} placeholder="질문에 대한 답을 적어보세요." className="w-full px-4 py-3 bg-white rounded-xl border border-purple-200 font-bold text-sm text-slate-900 focus:ring-2 focus:ring-purple-500 outline-none shadow-sm"/>
                          </div>
                        </div>
                        <button onClick={combineSentences} className="w-full bg-indigo-600 text-white font-black text-base py-4 rounded-xl shadow-lg hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">✨ 문장들 합치기 <span className="text-xl">👉</span></button>
                      </div>
                    </div>

                    <div className="lg:col-span-6 bg-white p-7 rounded-[2rem] border border-slate-200 shadow-md flex flex-col justify-between">
                      <div className="space-y-4">
                        <h3 className="text-xl font-black text-slate-900">📝 나의 기사글 다듬기</h3>
                        <p className="text-xs font-bold text-slate-500">왼쪽에서 합친 문장들을 여기서 자연스럽게 하나의 글로 고쳐보세요.</p>
                        <textarea value={draftText} onFocus={() => setFocusedField('draftText')} onChange={(e) => setDraftText(e.target.value)} placeholder="이곳에 문장이 모입니다. 자연스럽게 연결해보세요!" rows={12} className="w-full p-5 bg-slate-50 rounded-2xl border border-slate-200 font-medium text-base text-slate-800 leading-loose focus:bg-white focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-400 outline-none shadow-inner resize-none"/>
                      </div>
                      <div className="flex justify-end mt-6 pt-4 border-t border-slate-100">
                        <button onClick={() => setStep(3)} className="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-black text-lg shadow-xl shadow-emerald-200 hover:bg-emerald-700 hover:scale-105 transition-all">3단계: 마무리로 이동 👉</button>
                      </div>
                    </div>
                  </div>
                )}

                {/* 3단계 */}
                {step === 3 && (
                  <div className="bg-white p-8 rounded-[2rem] border border-slate-200 shadow-md space-y-8">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-5">
                      <h2 className="text-2xl font-black text-slate-900"><span className="text-emerald-600 mr-2">3단계.</span> 마무리 및 기사 제출</h2>
                      <button onClick={scanGrammar} className="bg-slate-100 text-slate-700 px-5 py-2.5 rounded-xl font-bold text-sm hover:bg-slate-200 transition-colors border border-slate-200 shadow-sm flex items-center gap-2">🔍 맞춤법 검사</button>
                    </div>

                    <div className="bg-gradient-to-br from-purple-50 to-indigo-50 p-6 rounded-3xl border border-purple-200 shadow-inner space-y-5">
                      <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                          <h3 className="text-lg font-black text-purple-900 flex items-center gap-2">✨ 기사 제목 정하기 <span className="bg-purple-600 text-white text-[10px] px-2 py-0.5 rounded-full">AI</span></h3>
                          <p className="text-xs font-bold text-purple-600 mt-1">내가 쓴 글에 어울리는 제목을 직접 짓거나, AI에게 추천받아 보세요!</p>
                        </div>
                        <button onClick={handleGenerateTitles} disabled={isGeneratingTitle || !draftText} className="bg-purple-600 hover:bg-purple-700 disabled:bg-purple-300 disabled:cursor-not-allowed text-white px-5 py-3 rounded-xl font-bold text-sm shadow-md transition-all flex items-center gap-2 shrink-0">
                          {isGeneratingTitle ? <><span className="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> 고민 중...</> : <>🤖 AI 제목 추천받기</>}
                        </button>
                      </div>
                      
                      <input type="text" value={activityTitle} onChange={(e) => setActivityTitle(e.target.value)} placeholder="여기에 기사 제목을 직접 입력하세요!" className="w-full px-5 py-4 bg-white rounded-2xl border-2 border-purple-300 font-black text-lg text-purple-900 focus:ring-4 focus:ring-purple-500/20 focus:border-purple-500 outline-none shadow-sm transition-all text-center"/>
                      
                      {suggestedTitles.length > 0 && (
                        <div className="flex flex-wrap gap-2 pt-2 items-center">
                          <span className="text-xs font-black text-purple-800 bg-purple-200 px-2 py-1 rounded-md">AI 추천:</span>
                          {suggestedTitles.map((title, idx) => (
                            <button key={idx} onClick={() => { setActivityTitle(title); triggerToast('✨ 추천 제목이 쏙 들어갔어요!'); }} className="px-4 py-2 bg-white border-2 border-purple-200 hover:border-purple-500 hover:bg-purple-50 text-purple-800 text-sm font-bold rounded-xl transition-all shadow-sm">
                              {title}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>

                    <div className="bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-3">
                      <span className="text-xs font-extrabold text-slate-500 uppercase tracking-wider">최종 기사문 확인</span>
                      <p className="text-base font-bold text-slate-900 leading-loose bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">{draftText || '2단계에서 문장을 작성하고 합쳐주세요!'}</p>
                    </div>

                    {grammarIssues.length > 0 && (
                      <div className="space-y-3 bg-amber-50/50 p-4 rounded-3xl border border-amber-100">
                        <h4 className="text-sm font-black text-amber-800">💡 맞춤법 도장 찍기</h4>
                        {grammarIssues.map((issue) => (
                          <div key={issue.id} className={`p-4 rounded-2xl border transition-colors ${issue.resolved ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200 shadow-sm'}`}>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-sm font-bold text-slate-800">"{issue.errorWord}"</span>
                              {issue.resolved && <span className="text-xs font-black text-emerald-600 bg-emerald-100 px-2 py-1 rounded-md">해결됨!</span>}
                            </div>
                            <p className="text-xs font-bold text-slate-500 mb-4">{issue.desc}</p>
                            <div className="flex gap-2">
                              {issue.options.map((opt, idx) => (
                                <button key={idx} onClick={() => resolveIssue(issue.id, opt, issue.correct)} disabled={issue.resolved} className={`flex-1 py-2.5 rounded-xl font-bold text-sm border transition-all ${issue.resolved && opt === issue.correct ? 'bg-emerald-600 text-white border-emerald-600 shadow-md' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>{opt}</button>
                              ))}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    <div className="bg-indigo-50 p-7 rounded-3xl border border-indigo-200 space-y-5">
                      <h3 className="text-lg font-black text-indigo-900">📮 완성! {targetTeacher ? `[${targetTeacher}] 반에` : '선생님께'} 제출하기</h3>
                      <div>
                        <label className="text-sm font-extrabold text-indigo-800 block mb-2">💬 한 줄 소감 (오늘 활동 어땠나요?)</label>
                        <input type="text" value={shortMsg} onChange={(e) => setShortMsg(e.target.value)} placeholder="예: 기사를 완성해서 뿌듯합니다!" className="w-full px-5 py-3.5 bg-white rounded-xl border-2 border-indigo-200 font-bold text-sm text-slate-900 focus:border-indigo-500 outline-none transition-colors shadow-sm"/>
                      </div>
                      <button onClick={handleSaveToSpreadsheet} disabled={isLoading} className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-black text-lg py-5 rounded-2xl shadow-xl shadow-indigo-200 transition-all hover:scale-[1.01]">
                        {isLoading ? '⏳ 안전하게 전송하는 중...' : `🚀 완벽해요! 기사 최종 제출하기`}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              <div className="space-y-6">
                <div className="bg-slate-900 text-white p-8 rounded-[2rem] shadow-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-slate-800 relative overflow-hidden">
                  <div className="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/20 rounded-full blur-3xl"></div>
                  <div className="relative z-10">
                    <span className="text-xs font-black text-emerald-400 bg-emerald-400/10 px-3 py-1.5 rounded-lg border border-emerald-500/30">
                      선생님 전용 관리자 모드
                    </span>
                    <h2 className="text-3xl font-black mt-3 tracking-tight">구글 시트 응답 현황 <span className="text-xl text-emerald-300 ml-2">({loggedInTeacher} 접속중)</span></h2>
                    <p className="text-sm font-bold text-slate-400 mt-2">우리 반({loggedInTeacher}) 학생들이 제출한 데이터만 필터링되어 보입니다.</p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3 relative z-10">
                    <button onClick={fetchSheetData} disabled={isLoading} className="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg transition-colors border border-indigo-500">🔄 새로고침</button>
                    <button onClick={downloadCSV} className="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg transition-colors border border-emerald-500">📊 우리 반 엑셀 다운로드</button>
                    <button onClick={handleClearSheet} disabled={isLoading} className="bg-rose-600 hover:bg-rose-500 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg transition-colors border border-rose-500">🗑️ 우리 반 데이터 비우기</button>
                  </div>
                </div>

                <div className="bg-white rounded-[2rem] border border-slate-200 shadow-md overflow-hidden">
                  <div className="p-5 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                    <span className="font-black text-base text-slate-800">
                      총 제출된 기사: <span className="text-indigo-600">{teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).length}</span>건
                    </span>
                    {isLoading && <span className="text-xs text-indigo-600 font-black animate-pulse bg-indigo-50 px-3 py-1 rounded-full">⏳ 통신 중...</span>}
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-sm text-slate-700 border-collapse">
                      <thead className="bg-slate-100/50 text-slate-900 font-black border-b border-slate-200">
                        <tr>
                          <th className="p-4 border-r border-slate-200 whitespace-nowrap">시간</th>
                          <th className="p-4 border-r border-slate-200">이름</th>
                          <th className="p-4 border-r border-slate-200">기사 제목</th>
                          <th className="p-4 border-r border-slate-200">기분 & 소감</th>
                          <th className="p-4 min-w-[300px]">최종 기사문</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 font-medium">
                        {teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).length === 0 ? (
                          <tr><td colSpan="5" className="p-10 text-center text-slate-400 font-bold bg-slate-50/50">아직 우리 반 학생이 제출한 기사가 없거나 통신 전입니다.</td></tr>
                        ) : (
                          teacherDataList.filter(row => row.targetTeacher === loggedInTeacher).map((row) => (
                            <tr key={row.id} className="hover:bg-indigo-50/30 transition-colors">
                              <td className="p-4 border-r border-slate-100 whitespace-nowrap text-xs text-slate-500 font-bold">{row.timestamp}</td>
                              <td className="p-4 border-r border-slate-100 font-black text-slate-900 text-base">{row.name}</td>
                              <td className="p-4 border-r border-slate-100 font-bold text-purple-700 max-w-[200px] truncate">{row.activityTitle}</td>
                              <td className="p-4 border-r border-slate-100 max-w-[200px]">
                                <div className="text-xs font-black text-amber-600 mb-1">{row.mood}</div>
                                <div className="text-xs text-slate-600 truncate">{row.shortMsg}</div>
                              </td>
                              <td className="p-4 text-slate-800 font-bold leading-relaxed">{row.draftText}</td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}
          </main>
          
          {/* 플로팅 버튼 (선생님 전용 잠금 화면 진입용) */}
          {activeTab === 'student' && !showPasswordModal && (
            <button 
              onClick={() => {setAuthMode('login'); setShowPasswordModal(true);}}
              className="fixed bottom-8 right-8 bg-slate-900 hover:bg-slate-800 text-white px-6 py-4 rounded-full font-black shadow-2xl shadow-slate-400 transition-all hover:-translate-y-1 hover:scale-105 flex items-center gap-3 z-40 border border-slate-700 group"
            >
              <span className="text-xl group-hover:animate-bounce">🔒</span>
              <span>선생님 전용</span>
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
